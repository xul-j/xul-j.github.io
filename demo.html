<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XUL-J live demo</title>
  <link rel="stylesheet" href="assets/xul.css">
  <style>
    #wire-log .in { color: var(--text); }
    #dev .hint { margin-left: auto; }
    @media (max-width: 700px) { #dev .hint { display: none; } }
  </style>
</head>
<body>
  <main id="app">
    <div id="root" class="x x-root"></div>
    <aside id="wire">
      <header>
        <strong>Wire</strong>
        <span id="wire-count">0 ops</span>
        <label><input type="checkbox" id="wire-pause"> pause</label>
      </header>
      <ol id="wire-log" aria-live="off"></ol>
    </aside>
  </main>
  <footer id="dev">
    <button type="button" id="replay">Replay from scratch</button>
    <button type="button" id="wire-toggle">Hide wire</button>
    <span class="hint">← server ops · → browser intents</span>
  </footer>
  <script src="assets/xulj.js"></script>
  <script src="assets/demo-app.js"></script>
</body>
</html>
